name: Scrape Spices Board Market Rates

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Wake backend (Render free tier spins down when idle)
        run: |
          curl -sS --max-time 90 "${{ secrets.MARKET_RATES_BACKEND_URL }}/api/" || true

      - name: Trigger market rate scrape
        run: |
          curl -sS --fail-with-body --max-time 60 -X POST "${{ secrets.MARKET_RATES_BACKEND_URL }}/api/admin/market-rates/scrape" \
            -H "X-Scrape-Secret: ${{ secrets.MARKET_RATES_SCRAPE_SECRET }}"
